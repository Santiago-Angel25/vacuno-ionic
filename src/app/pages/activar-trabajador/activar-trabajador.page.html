<ion-content [fullscreen]="true" class="activate-content">
  <div class="activate-landscape" aria-hidden="true"></div>
  <main class="activate-page">
    <a class="activate-brand" routerLink="/login" aria-label="VACUNO inicio">
      <img src="/assets/vacuno-logo-mark.png" alt="VACUNO" />
    </a>
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <ion-grid class="ion-no-padding">
        <ion-row>
          <ion-col size="12">
            <h1>Activa tu cuenta</h1>
          </ion-col>
          <ion-col size="12">
            <p class="help">
              Pega el código que te entregó el propietario y crea una contraseña de 8 a 72 caracteres con al menos un
              número y un carácter especial.
            </p>
          </ion-col>
          <ion-col size="12">
            <label for="invite-code">Código de invitación *</label
            ><ion-item lines="none"
              ><ion-input
                id="invite-code"
                formControlName="codigo"
                autocapitalize="characters"
                placeholder="Pega aquí tu código"
              ></ion-input
            ></ion-item>
          </ion-col>
          <ion-col size="12">
            <label for="worker-password">Nueva contraseña *</label
            ><ion-item lines="none"
              ><ion-input
                id="worker-password"
                type="password"
                formControlName="password"
                placeholder="8 a 72 caracteres, número y símbolo"
              ></ion-input
            ></ion-item>
          </ion-col>
          <ion-col size="12">
            <label for="worker-password-confirm">Confirmar contraseña *</label
            ><ion-item lines="none"
              ><ion-input
                id="worker-password-confirm"
                type="password"
                formControlName="confirmar"
                placeholder="Repite la contraseña"
              ></ion-input
            ></ion-item>
          </ion-col>
          <ion-col size="12">
            @if (errorMessage) {
            <p class="form-error" role="alert">{{ errorMessage }}</p>
            }
          </ion-col>
          <ion-col size="12">
            <ion-button expand="block" type="submit" [disabled]="saving"
              >{{ saving ? 'Activando…' : 'Activar y entrar' }}</ion-button
            >
          </ion-col>
          <ion-col size="12">
            <p class="back-login">Volver al <a routerLink="/login">inicio</a></p>
          </ion-col>
        </ion-row>
      </ion-grid>
    </form>
  </main>
</ion-content>
