<ion-tabs>
  <ion-tab-bar slot="bottom" class="vacuno-tab-bar">
    <ion-tab-button tab="inicio" href="/tabs/inicio">
      <ion-icon aria-hidden="true" name="home-outline"></ion-icon>
      <ion-label>Inicio</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="ganado" href="/tabs/ganado">
      <ion-icon aria-hidden="true" name="paw-outline"></ion-icon>
      <ion-label>Ganado</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="inventario" href="/tabs/inventario">
      <ion-icon aria-hidden="true" name="leaf-outline"></ion-icon>
      <ion-label>Inventario</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="actividad" href="/tabs/actividad">
      <ion-icon aria-hidden="true" name="calendar-outline"></ion-icon>
      <ion-label>Actividad</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="perfil" href="/tabs/perfil" aria-label="Abrir perfil">
      <ion-avatar class="tab-avatar">
        <span>{{ avatarInitial }}</span>
      </ion-avatar>
      <ion-label>Más</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
